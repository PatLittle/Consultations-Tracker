    \  padding: 0 1.5rem;\n  display: flex;\n  justify-content: flex-end;\n}\n.gcds-footer-wordmark__inner\
    \ img {\n  height: 2.2rem;\n  filter: brightness(0) invert(1);\n}\n@media (max-width:\
    \ 768px) {\n  nav .container {\n    flex-direction: column;\n    align-items:\
