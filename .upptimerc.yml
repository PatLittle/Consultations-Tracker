  introMessage: 'GC Automated Consultations QA monitors open and planned consultations
    published

    on [Consulting with Canadians](https://www.canada.ca/en/government/system/consultations/consultingcanadians.html),

    verifying each profile page every four hours to confirm that it remains available.

    Use this dashboard to review uptime history, response times, and reports that
    highlight

    consultations starting soon, due to launch, or running past their scheduled end
    date.

    '
