    \ 1rem;\n  }\n}\n"
  js: "document.addEventListener(\"DOMContentLoaded\", () => {\n  const main = document.querySelector(\"\
    main.container\");\n  if (main && !main.id) {\n    main.id = \"main-content\"\
    ;\n  }\n  const nav = document.querySelector(\"nav\");\n  if (nav) {\n    nav.setAttribute(\"\
    role\", \"navigation\");\n    nav.setAttribute(\"aria-label\", \"Primary navigation\"\
    );\n  }\n});\n"
